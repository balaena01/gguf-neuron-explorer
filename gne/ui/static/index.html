<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gne explorer</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23e8b04a'/%3E%3C/svg%3E">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<header id="header">
  <span class="brand">gne</span>
  <span class="seg" id="views">
    <button data-view="map" class="on">map</button><button data-view="layers">layers</button><button data-view="embed">embed</button>
  </span>
  <label>layer <select id="layer-select"></select></label>
  <label>color <select id="color-select"></select></label>
  <span id="cos-thr-wrap" class="hidden" title="|cos| の閾値"><input type="range" id="cos-thr" min="0" max="1" step="0.001"><span id="cos-thr-val" class="mono"></span></span>
  <label>jump <input id="jump" placeholder="L14 N8949" size="11" spellcheck="false"></label>
  <span id="search" class="seg"><select id="search-mode" title="検索の対象"><option value="lens">lens</option><option value="words">words</option><option value="name">name</option></select><input id="search-q" placeholder="検索(alien など)" size="14" spellcheck="false"></span>
  <button id="reset-view" title="全体の視点に戻る">全体</button>
  <span id="status" class="mono"><span id="status-main"></span></span>
</header>
<main id="main">
  <aside id="list" class="panel collapsed">
    <div class="panel-head"><button class="toggle" data-target="list">LIST</button></div>
    <div class="panel-body">
      <div class="tabs" id="list-tabs"><button data-tab="rank" class="on">rank</button><button data-tab="search" class="hidden">検索</button><button data-tab="fires">fires</button><button data-tab="recipe">recipe <span id="recipe-count" class="muted"></span></button></div>
      <div id="rank"></div>
      <div id="search-list" class="hidden"></div>
      <div id="fires-list" class="hidden"></div>
      <div id="recipe-list" class="hidden"></div>
    </div>
  </aside>
  <section id="map-wrap">
    <div id="map"></div>
    <div id="overlay" class="mono"></div>
    <div id="tooltip" class="mono hidden"></div>
    <div id="legend" class="mono"></div>
    <div id="view-placeholder" class="hidden"></div>
    <div id="layers-view" class="hidden"></div>
  </section>
  <aside id="neuron" class="panel collapsed">
    <div class="panel-head"><button class="toggle" data-target="neuron">NEURON</button><button id="neuron-wide" class="toggle" title="NEURON を広げる・戻す">⇔ 広げる</button></div>
    <div class="panel-body" id="neuron-body"><p class="muted">マップのニューロン、または LIST の行をクリック</p></div>
  </aside>
</main>
<footer id="jobs" class="mono"><span id="jobs-bar"><span class="muted">jobs: なし</span></span><span id="perf"></span></footer>
<script type="module" src="app.js"></script>
</body>
</html>
