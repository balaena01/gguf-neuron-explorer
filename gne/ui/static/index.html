<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gne explorer</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23e8b04a'/%3E%3C/svg%3E">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<header id="header">
  <span class="brand">gne</span>
  <!-- 画面の切り替え: 探す / 作る / 確かめる の 3 群 -->
  <nav id="views" aria-label="画面" data-i18n-aria-label="画面">
    <div class="grp"><span class="grp-l" data-i18n="探す" data-i18n-en="Explore">探す</span><span class="nav">
      <button type="button" data-view="map" class="on" aria-current="true" data-i18n-en="map" data-i18n="地図">地図</button><button type="button" data-view="layers" data-i18n-en="layers" data-i18n="層">層</button><button type="button" data-view="writers" data-i18n-en="writers" data-i18n="書き手">書き手</button><button type="button" data-view="embed" data-i18n-en="embed" data-i18n="埋め込み">埋め込み</button></span></div>
    <div class="grp"><span class="grp-l" data-i18n="作る" data-i18n-en="Build">作る</span><span class="nav">
      <button type="button" data-view="direction" data-i18n-en="direction" data-i18n="方向">方向</button><button type="button" data-view="chips" data-i18n-title="対照の文から方向を作り、効くヘッドを探して強さを配る(CHiPS)" title="対照の文から方向を作り、効くヘッドを探して強さを配る(CHiPS)">CHiPS</button><button type="button" data-view="keys" data-i18n-en="keys" data-i18n="鍵" data-i18n-title="鍵つきの書き込み(keyed)の鍵を作り、分かれ方を確かめる" title="鍵つきの書き込み(keyed)の鍵を作り、分かれ方を確かめる">鍵</button><button type="button" data-view="fish" data-i18n-title="すでにあるニューロンを式から計算した重みで書き換え、決まった場面の返事でだけ方向を書く(FiSH)" title="すでにあるニューロンを式から計算した重みで書き換え、決まった場面の返事でだけ方向を書く(FiSH)">FiSH</button></span></div>
    <div class="grp"><span class="grp-l" data-i18n="確かめる" data-i18n-en="Check">確かめる</span><span class="nav">
      <button type="button" data-view="eval" data-i18n-en="eval" data-i18n="評価">評価</button><button type="button" data-view="cand" data-i18n-en="candidates" data-i18n="強さの候補">強さの候補</button></span></div>
  </nav>
  <label><span class="lbl" data-i18n="移動" data-i18n-en="Go to">移動</span> <input id="jump" placeholder="L14 N8949" size="11" spellcheck="false" data-i18n-title="ニューロンへ飛ぶ(L14 N8949 の形で Enter)" title="ニューロンへ飛ぶ(L14 N8949 の形で Enter)"></label>
  <span id="search" class="seg"><select id="search-mode" data-i18n-title="検索の対象" title="検索の対象"><option value="lens" data-i18n="lens の語" data-i18n-en="lens words">lens の語</option><option value="words" data-i18n="sweep の語">sweep の語</option><option value="name" data-i18n="名前">名前</option></select><input id="search-q" data-i18n-placeholder="検索(alien など)" placeholder="検索(alien など)" size="14" spellcheck="false"></span>
  <button id="agent-btn" class="hidden" data-i18n="エージェント">エージェント</button>
  <span id="lang" class="seg" title="表示の言語 / Language"><button data-lang="ja">JP</button><button data-lang="en">EN</button></span>
</header>
<main id="main">
  <aside id="list" class="panel collapsed">
    <div class="panel-head"><button class="toggle" data-target="list" data-i18n="一覧" data-i18n-en="LIST">一覧</button></div>
    <div class="panel-body">
      <div class="tabs" id="list-tabs"><button data-tab="rank" class="on" data-i18n="順位" data-i18n-en="rank">順位</button><button data-tab="search" class="hidden" data-i18n="検索">検索</button><button data-tab="fires" data-i18n="反応を見る" data-i18n-en="fires">反応を見る</button></div>
      <div id="rank"></div>
      <div id="search-list" class="hidden"></div>
      <div id="fires-list" class="hidden"></div>
    </div>
  </aside>
  <section id="map-wrap">
    <!-- 地図だけで使う設定(層・並べ方・色・線)と、この層で計算 -->
    <div id="map-bar">
      <label><span class="lbl" data-i18n="層" data-i18n-en="layer">層</span> <select id="layer-select" data-i18n-title="表示する層" title="表示する層"></select></label>
      <label><span class="lbl" data-i18n="並べ方">並べ方</span> <select id="layout-select" data-i18n-title="シート内の並べ方" title="シート内の並べ方"><option value="index" data-i18n="番号順">番号順</option><option value="writes" data-i18n="書く向き">書く向き</option><option value="lens" data-i18n="lens の語" data-i18n-en="lens words">lens の語</option></select></label>
      <label><span class="lbl" data-i18n="色">色</span> <select id="color-select" data-i18n-title="点の色(overlay)" title="点の色(overlay)"></select></label>
      <span id="cos-thr-wrap" class="hidden" data-i18n-title="|cos| の閾値" title="|cos| の閾値"><input type="range" id="cos-thr" min="0" max="1" step="0.001"><span id="cos-thr-val" class="mono"></span></span>
      <button id="web-toggle" data-i18n-title="開いたニューロンの配線: 直接(上流・下流 14 本ずつ)→ 多段 → なし" title="開いたニューロンの配線: 直接(上流・下流 14 本ずつ)→ 多段 → なし" data-i18n="線: 直接">線: 直接</button>
      <button id="map-compute" class="hidden" aria-haspopup="menu" data-i18n-title="いまの層(層の選択欄)で lens・sweep・配置・connections を計算する(層の番号の右クリックと同じ)" title="いまの層(層の選択欄)で lens・sweep・配置・connections を計算する(層の番号の右クリックと同じ)" data-i18n="この層で計算 ▾">この層で計算 ▾</button>
      <button id="reset-view" class="quiet" data-i18n-title="全体の視点に戻る" title="全体の視点に戻る" data-i18n="全体を見る">全体を見る</button>
    </div>
    <div id="map-stage">
      <div id="map"></div>
      <div id="overlay" class="mono"></div>
      <div id="tooltip" class="mono hidden"></div>
      <div id="legend" class="mono"></div>
    </div>
    <div id="view-placeholder" class="hidden"></div>
    <div id="layers-view" class="hidden"></div>
    <div id="direction-view" class="hidden"></div>
    <div id="eval-view" class="hidden"></div>
    <div id="writers-view" class="hidden"></div>
    <div id="embed-view" class="hidden"></div>
    <div id="agent-pop" class="hidden"></div>
  </section>
  <!-- くわしく見る: ニューロン・ヘッド・専門家を 1 枚で(種類で中身を切り替える) -->
  <aside id="detail" class="panel side collapsed">
    <div class="panel-head"><button class="toggle" data-target="detail" data-i18n="くわしく見る">くわしく見る</button>
      <span class="seg" id="detail-kinds"><button data-kind="neuron" disabled data-i18n="ニューロン">ニューロン</button><button data-kind="head" disabled data-i18n="ヘッド">ヘッド</button><button data-kind="expert" class="hidden" disabled data-i18n="専門家">専門家</button></span>
      <button id="detail-wide" class="quiet" data-i18n-title="くわしく見るを広げる・戻す" title="くわしく見るを広げる・戻す" data-i18n="⇔ 広げる">⇔ 広げる</button></div>
    <div class="panel-body" id="neuron-body"><p class="muted" data-i18n="マップのニューロン、または LIST の行をクリック">マップのニューロン、または LIST の行をクリック</p></div>
    <div class="panel-body hidden" id="head-body"><p class="muted" data-i18n="マップの板の上辺の刻み(ヘッド)をクリック。jump に L21 H7 でも開けます">マップの板の上辺の刻み(ヘッド)をクリック。jump に L21 H7 でも開けます</p></div>
    <div class="panel-body hidden" id="expert-body"><p class="muted" data-i18n="jump に L12 E37 で専門家を開けます(ニューロンの「専門家を開く」からも)">jump に L12 E37 で専門家を開けます(ニューロンの「専門家を開く」からも)</p></div>
  </aside>
  <!-- レシピ: どの画面からも足せるよう、右に常に置く(細くたたむ・広げる) -->
  <aside id="recipe" class="panel side">
    <div class="panel-head"><button class="toggle" data-target="recipe" data-i18n="レシピ">レシピ</button><span id="recipe-count" class="pill"></span>
      <button id="recipe-wide" class="quiet" data-i18n-title="レシピを広げる・戻す" title="レシピを広げる・戻す" data-i18n="⇔ 広げる">⇔ 広げる</button></div>
    <div class="panel-body" id="recipe-list"></div>
  </aside>
</main>
<footer id="jobs" class="mono"><span id="jobs-bar"><span class="muted" data-i18n="ジョブ: なし">ジョブ: なし</span></span><span id="status"><span id="status-main"></span></span><span id="perf"></span></footer>
<script type="module" src="app.js"></script>
</body>
</html>
