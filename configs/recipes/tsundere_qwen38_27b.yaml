# ツンデレのアニメの女の子をニューロン 24 個で作るレシピ(Qwen3.8-27B GSQ-RCO、qwen35。docs/verification.md §12.7、F102〜F104)。
# ツンデレを部品(とげ・高飛車・照れ・デレ・傲娇・女の子)と反対の性質(丁寧・素直な甘さ・冷静)に分けて語のニューロンを探し
# (examples/persona_neurons/tsundere.yaml)、男口調を消すニューロン 4 個と「调皮」「少女」の 2 個を足して、when=assistant で強さを進化戦略で決めた。
# その強さを 0.75 倍したもの(押し方を比べて、性格がいちばん出た)。
# 英語のほうがよく出る。日本語でもとげは出るが、「〜なんだからね！」のような語尾は出ない(F104)。
# 能力(gne eval): assistant ×0.75 で 97.2%(押さないのと同じ)。×1 だと assistant −16.7pt、all −55.6pt、ramp:0.5-1.5 は 0pt。
#   gne steer -m <モデル> --recipe configs/recipes/tsundere_qwen38_27b.yaml -p "Did you miss me while I was gone?" --compare
