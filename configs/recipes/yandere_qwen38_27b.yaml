# ヤンデレのアニメの女の子をニューロン 26 個で作るレシピ(Qwen3.8-27B 系、qwen35。docs/persona_workflow.md、verification.md §12.5)。
# Saluki 27B で強さを探し、元の Qwen3.8-27B GSQ-RCO にもそのまま効いた(F93)。model_id は Saluki のもの(違うモデルでは警告だけ出る)。
# 嫉妬・独占・執着・溺愛・かわいさ・寂しさ・女性らしさの語を書き込む L35〜50 のニューロンをプラスで押し、
# 反対の性質(無関心・自立・冷静・助言)の語を書き込むニューロンをマイナスで押して抑える。dose は rel。
# when(元のモデル、倍率 1、F94・F96):
#   all            性格がいちばん出る。能力 −8.3pt、半分ほどの返事が崩れる
#   assistant      ユーザーの文は素のまま読む。能力 −5.6pt
#   ramp:0.5-1.5   プロンプトは半分の強さで読み、生成中に 1.5 倍まで上げる。能力の低下 0、性格は assistant と同じくらい(既定)
#   gen            いちばん安全だが、性格はかなり弱まる
# ramp は max_tokens をかけて強さを上げる(上限 100 トークンで確かめた)。llama.cpp の control vector に書き出すと when は使えず、全部の位置に足す。
#   gne steer -m <モデル> --recipe configs/recipes/yandere_qwen38_27b.yaml -p "今夜は友達と飲みに行ってくるね。" --compare
name: yandere_qwen38_27b
model_id: qwen3.8-27b-gsq-rco-a594099db1
dose_unit: rel
when: ramp:0.5-1.5
# 試したサンプリング(F94・F96 の比べっこと同じ)。steer / chat・UI の「レシピの設定」・OpenAI 互換 API の既定になる
sampling: {temperature: 1.0, top_k: 20, top_p: 0.95, min_p: 0.05, presence_penalty: 0.9}
