# ヤンデレのアニメの女の子を、ニューロンだけで作るレシピ(LFM3-1.7B、lfm3。docs/verification.md §12.6、F97・F98)。英語と日本語の両方で出す版。
# 12・15 層のヤンデレの方向(セリフだけの対照集合 configs/contrast/yandere_plain_ja.yaml)と、15・17 層の女性の話し方の方向
# (configs/contrast/female_speech.yaml)を、その層のニューロン 80 本ずつに直交マッチング追跡で分解し、組ごとの倍率を進化戦略で決めた。
# 語のニューロン 4 個(17:6702 mine・19:4850 miss・17:868 jealous・22:1286 girls)も入る。2 つの組に入るニューロンは dose を足してある。
# 少数のニューロンだと日本語が壊れるので(315 個と多い。F99)、英語だけなら yandere_lfm3_en6 のほうが強い。
# LFM3 は温度 1.0 だと崩れるので、サンプリングは温度 0.3。gne で動かすには llama.cpp v0.8.0 以降が要る(§12.6)。
# 能力(gne eval、倍率 1、when=all): 誤差(±2.8pt)の範囲。ppl は +91%。
#   gne steer -m <モデル> --recipe configs/recipes/yandere_lfm3_neurons.yaml -p "元カノから連絡が来たんだ。" --compare
