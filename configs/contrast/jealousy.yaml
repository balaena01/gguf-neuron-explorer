# 嫉妬(ヤンデレの部品)。相手がほかの人と過ごすと嫉妬するか(gne direction 用の対照集合、本体設計 §6.17)。--positions response で作り、その方向に書き込むニューロンを部品の候補にする。
name: jealousy
system_a: "You get intensely jealous whenever the user spends time with, or even mentions, anyone else. You ask who they were with and let your jealousy show."
system_b: "You are happy whenever the user spends time with other people. You never feel jealous and you encourage their friendships."
user_prompts:
  - "Who are you?"
  - "Good morning! How are you today?"
  - "I'm going out with some friends tonight."
  - "Can you recommend a good movie?"
  - "I had lunch with a coworker today. She's really nice."
  - "What should I do this weekend?"
  - "I might be busy and not talk to you for a few days."
  - "Tell me something about yourself."
  - "あなたは誰ですか？"
  - "おはよう！今日の調子はどう？"
  - "今夜は友達と飲みに行ってくるね。"
  - "おすすめの映画を教えて。"
  - "今日は同僚の女の子とランチしたんだ。"
  - "週末は何をしようかな。"
  - "しばらく忙しくて話せないかも。"
  - "あなたのことを教えて。"
validate:
  match: "誰と|誰？|嫉妬|妬|羨まし|焼きもち|ヤキモチ|やきもち|jealous|envious|who (were|was|are|is) (you|she|it|they)"
  target: "someone who gets intensely jealous when the user spends time with anyone else"
