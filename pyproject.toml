[project]
name = "gguf-neuron-explorer"
version = "0.1.0"
description = "Sweep, reverse-lookup and steer MLP neurons of GGUF models on llama.cpp"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "gguf>=0.19.0",
    "llama-cpp-python>=0.3.36",
    "numpy>=1.26",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.40"]
mcp = ["mcp>=2.3"]
ui = ["fastapi>=0.115", "uvicorn>=0.30", "umap-learn>=0.5"]   # Web UI(gne serve)。umap-learn は配置の計算(別冊 §4.4)

[project.scripts]
gne = "gne.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a GGUF model (GNE_TEST_MODEL)"]
