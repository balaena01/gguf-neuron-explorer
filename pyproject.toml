[project]
name = "gguf-neuron-explorer"
version = "0.1.0"
description = "Sweep, reverse-lookup and steer MLP neurons of GGUF models on llama.cpp"
requires-python = ">=3.11"
dependencies = [
    "gguf>=0.19.0",
    "llama-cpp-python>=0.3.36",
    "numpy>=1.26",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gne = "gne.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a GGUF model (GNE_TEST_MODEL)"]
